name: CI

on:
  push:
    branches: [main]
  pull_request:

# Start from no permissions and grant only what a step needs.
permissions:
  contents: read

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::go.mod/go.sum are out of date. Run 'make tidy' and commit the result."
            git status --porcelain
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build -o bin/gatekeep ./cmd/gatekeep
